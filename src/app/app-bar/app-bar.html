<mat-sidenav-container class="layout-container" style="height: 100vh;">

  <!-- Drawer -->
  <mat-sidenav #drawer mode="side" class="drawer">
    <div class="drawer-header">
      <h3>Menu</h3>
    </div>

    <mat-nav-list>
      <a mat-list-item href="#">Action 1</a>
      <a mat-list-item href="#">Action 2</a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Main content -->
  <mat-sidenav-content>
    <mat-toolbar class="primary">
      <button matIconButton (click)="drawer.toggle()" class="white" aria-label="Example icon-button with menu icon">
        <mat-icon>menu</mat-icon>
      </button>
    </mat-toolbar>

    <div class="container">
      <app-tabs />
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
