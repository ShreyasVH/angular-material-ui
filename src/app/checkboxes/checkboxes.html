<div>
    <mat-checkbox class="primary" [checked]="true">
        Primary
    </mat-checkbox>

    <mat-checkbox class="accent" [checked]="true">
        Accent
    </mat-checkbox>

    <mat-checkbox class="warn" [checked]="true">
        Warn
    </mat-checkbox>

    <mat-checkbox [checked]="true" [disabled]="true">
        Disabled
    </mat-checkbox>
</div>
